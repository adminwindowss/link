<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Update</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Sfondo stile Windows 11 */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #0078d4 0%, #005a9e 50%, #003c72 100%);
            z-index: 0;
        }

        .bg-pattern {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.03) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 80%, rgba(0,0,0,0.1) 0%, transparent 60%);
            z-index: 1;
        }

        /* Finestra Principale */
        .update-window {
            position: relative;
            z-index: 10;
            width: 520px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
            overflow: hidden;
            animation: windowSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes windowSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Barra Titolo */
        .title-bar {
            background: #f0f0f0;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .title-bar-text {
            font-size: 12px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-bar-text svg {
            width: 16px;
            height: 16px;
        }

        .title-bar-buttons {
            display: flex;
            gap: 8px;
        }

        .title-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: default;
            background: #e0e0e0;
        }

        /* Contenuto */
        .content {
            padding: 32px;
            text-align: center;
        }

        /* Icona Windows */
        .windows-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 4px;
        }

        .windows-logo div {
            border-radius: 2px;
        }

        .windows-logo div:nth-child(1) { background: #f25022; }
        .windows-logo div:nth-child(2) { background: #7fba00; }
        .windows-logo div:nth-child(3) { background: #00a4ef; }
        .windows-logo div:nth-child(4) { background: #ffb900; }

        /* Spinner di caricamento */
        .spinner-container {
            margin: 24px auto;
            width: 48px;
            height: 48px;
            position: relative;
        }
